name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds
      # Trusted publishing requires npm >= 11.5.1. Pin to the 11.x line: npm@latest
      # went to 12.0.0 (2026-07), whose provenance path throws `Cannot find module
      # 'sigstore'` under `npm publish` (a .0 major regression that broke the 0.5.0
      # publish). 11.x stays >= 11.5.1 and publishes cleanly; revisit when 12.x is fixed.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run typecheck
      # Builds, then runs the byte-identity parity corpus + unit suite under
      # node --test. The parity gate (test/golden/) is the whole point of this
      # package: a drifted chain (a bumped @babel/standalone or plugin) fails here.
      - run: npm test
      # Build the prebuilt classic transform worker (R3-149/R3-150) and prove it
      # answers `transform` + `mdx-compile` over the MessagePort transport, with the
      # MDX compile byte-identical to the in-process chain and DOM-free. Publish ships
      # this esbuild-built `worker/` dir (prepublishOnly builds it); this gate is why
      # a broken worker never publishes. The worker build is only exercised here, not
      # in the golden run.
      - run: npm run test:worker
      - run: npm run build
      # Publishing (version bump + tag + npm publish --provenance) is handled by the
      # manual release.yml workflow, not on push.
