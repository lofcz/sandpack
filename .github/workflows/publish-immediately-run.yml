name: Publish to npm (OIDC) — disabled

# Disabled: @lofcz/sandpack-client uses release.yml (workflow_dispatch) as its
# single trusted publisher. npm allows only one trusted publisher per package.
# Keep this file for reference; re-enable only after switching the npm trust
# target away from release.yml.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type enable-only-if-trusted-for-this-workflow"
        required: true

jobs:
  build-publish:
    if: github.event.inputs.confirm == 'enable-only-if-trusted-for-this-workflow'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Publish each package (skip if already published)
        env:
          NODE_AUTH_TOKEN: ""
          NPM_CONFIG_PROVENANCE: true
        run: |
          for pkg in sandpack-client sandpack-react sandpack-themes; do
            name=$(node -p "require('./$pkg/package.json').name")
            ver=$(node -p "require('./$pkg/package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "::notice::$name@$ver already published — skipping."
            else
              (cd "$pkg" && npm publish --provenance --access public)
            fi
          done
