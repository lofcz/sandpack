name: Release and Publish to npm

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Release type
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure npm supports OIDC trusted publishing
        run: npm install -g npm@latest

      - name: Enable Corepack (Yarn 1)
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run tests
        run: yarn workspace @lofcz/sandpack-client test

      - name: Build
        # Rollup only — gulped bundler assets are not part of this fork's publish
        # (sciobot hosts the bundler on Priprava and passes bundlerURL).
        run: yarn workspace @lofcz/sandpack-client build

      - name: Bump package version
        id: version
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release_type }}
        run: |
          node <<'EOF'
          const fs = require("fs");

          function bumpVersion(version, type) {
            const [major, minor, patch] = version.split(".").map(Number);
            if (type === "major") return `${major + 1}.0.0`;
            if (type === "minor") return `${major}.${minor + 1}.0`;
            return `${major}.${minor}.${patch + 1}`;
          }

          const type = process.env.RELEASE_TYPE;
          const path = "sandpack-client/package.json";
          const json = JSON.parse(fs.readFileSync(path, "utf8"));
          const version = bumpVersion(json.version, type);
          json.version = version;
          fs.writeFileSync(path, `${JSON.stringify(json, null, 2)}\n`);

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          console.log(`Bumped @lofcz/sandpack-client to ${version}`);
          EOF

      - name: Commit release version and create tag
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add sandpack-client/package.json
          git commit -m "chore: release v${{ steps.version.outputs.version }}"
          git tag -a "v${{ steps.version.outputs.version }}" -m "Release v${{ steps.version.outputs.version }}"

      - name: Publish package
        env:
          NPM_CONFIG_PROVENANCE: true
        run: |
          name="$(node -p "require('./sandpack-client/package.json').name")"
          version="$(node -p "require('./sandpack-client/package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "skip $name@$version (already on registry)"
          else
            echo "publish $name@$version"
            (cd sandpack-client && npm publish --provenance --access public)
          fi

      - name: Push release commit and tag
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
